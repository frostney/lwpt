name: PR

# Fast PR gate. Mirrors the GocciaScript pattern: ci.yml runs only
# on push to main, so pr.yml is the sole pre-merge signal a PR sees.
#
#   pr.yml      — every ordinary and managed PR:
#                 Ubuntu native bootstrap + install + format --check + build +
#                 ordinary tests, then the live-network E2E paths on the
#                 same Linux leg (#102); a native aarch64-darwin
#                 ordinary-test leg; and a
#                 win64 leg: cross-compile on macOS, then the
#                 offline ordinary tests natively on
#                 windows-latest. Typical wall-clock
#                 < 10 min on a warm toolchain cache (hard caps per job/step).
#   ci.yml      — push to main only: full 6-target cross-build +
#                 per-platform native test runs (including E2E paths on
#                 every platform). Post-merge confirmation.
#   release.yml — tag-triggered cross-build + package + publish.
#
# Trade-off, deliberate: a PR that introduces a regression on the
# legs the gate still omits (x86_64-darwin, aarch64-linux,
# i386-win32, or non-Linux e2e) will pass pr.yml and only fail on
# the main-branch ci.yml run. The maintainer reverts/forwards-fixes
# from main. Pre-merge coverage now spans Linux ordinary+E2E,
# aarch64-darwin ordinary, and win64 offline (#102 extended the
# original Ubuntu+win64 gate). This bounded trade keeps PR feedback
# cheap, which is the conscious GocciaScript design
# choice we mirror.
#
# The first carve-out from that trade-off was Windows, via the
# win64 leg. {$IFDEF WINDOWS} codepaths never compile on the Ubuntu
# runner, so a unit-shadowing mistake (the SysUtils.FindClose vs
# Windows.FindClose class — introduced by PR #17, fixed by PR #21)
# used to merge green and break main. windows-cross-compile closes
# the compile gap (one win64 cross-compile reusing the toolchain
# cache main runs keep warm); windows-test then runs the offline
# ordinary tests natively against that binary, catching
# Windows-only runtime breaks (junction installs, path handling,
# process env) and compile breaks in test sources, which lwpt test
# compiles with the native FPC. #102 added the next two carve-outs
# (the Linux E2E step and the darwin-test leg below) after the
# #84/#105 escape classes. Still post-merge only: the i386-win32
# leg, E2E paths on non-Linux platforms, bootstrap.bat, and the
# x86_64-darwin / aarch64-linux permutations.
#
# The Ubuntu native build deliberately uses the distro FPC (same
# as the install instructions in README.md), so a regression that
# only shows up with the system FPC's slightly older RTL gets
# caught here too.

on:
  pull_request:
    branches:
      - main
      # Native stacked PRs target the branch immediately below them. Rush
      # branches use the codex/ prefix, so include those bases as well as main.
      - 'codex/**'
    types:
      - opened
      - reopened
      - synchronize
permissions:
  contents: read
  pull-requests: read

# The commit-amend-push PR cycle is the canonical cancel-in-progress
# case: a superseded push should not keep burning the macOS runner
# (or, on a cold cache, a ~30-min toolchain rebuild).
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  delivery-gate:
    runs-on: ubuntu-latest
    outputs:
      deferred: ${{ steps.route.outputs.deferred }}
    steps:
      - name: Defer unadmitted managed work
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          attempts=1
          if [ "$IS_DRAFT" = "true" ]; then attempts=6; fi
          for attempt in $(seq 1 "$attempts"); do
            LABELS="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name')"
            if grep -Fxq 'delivery:managed' <<<"$LABELS" && { \
               [ "$RUN_ATTEMPT" = "1" ] || \
               ! grep -Fxq 'ci:ready' <<<"$LABELS"; }; then
              echo 'deferred=true' >> "$GITHUB_OUTPUT"
              echo 'Managed work remains deferred until its explicit ci transition.'
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then sleep 3; fi
          done
          echo 'deferred=false' >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: delivery-gate
    if: ${{ needs.delivery-gate.outputs.deferred != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # persist-credentials: false on every pr.yml checkout: these jobs
      # build and EXECUTE the PR's own code (bootstrap, lwpt, tests),
      # so no git auth material should sit in the workspace git config.
      # No step here performs authenticated git operations.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Bootstrap (cold build of build/lwpt)
        run: ./bootstrap.sh

      - name: Test inventory documentation is generated
        run: instantfpc -Fu./source -Fi./source scripts/update-test-inventory.pas --check

      - name: lwpt --help (binary loads?)
        run: ./build/lwpt --help

      # Frozen check runs BEFORE the plain install: plain install
      # rewrites lwpt.lock on the runner, so it can never detect a
      # committed lockfile that drifted from the committed trees.
      - name: lwpt install --frozen (committed lockfile matches committed trees?)
        run: ./build/lwpt install --frozen

      - name: lwpt install (workspace auto-discovery + symlinks)
        run: ./build/lwpt install

      - name: lwpt format --check (formatting drift?)
        run: ./build/lwpt format --check

      - name: lwpt build (compile every [build] entry)
        run: ./build/lwpt build

      # Runs after `lwpt build` so the freshly compiled binary — i.e.
      # the PR's own command surface — is what the committed AGENTS.md
      # block is checked against (ADR-0027).
      - name: lwpt agents --check (AGENTS.md command reference fresh?)
        run: ./build/lwpt agents --check

      - name: lwpt test --bail=1 (ordinary project paths)
        run: >-
          ./build/lwpt test
          'source/*.Test.pas'
          'packages/*/source/*.Test.pas'
          'tests/integration/*.Test.pas'
          --bail=1

      # PR-gate extension (#102): the project-owned E2E paths run on this
      # one Linux leg pre-merge. Evidence: the #84 TLS-close regression
      # was only reachable through these programs. The ordinary pass above
      # retains the concurrency suites which cover the #101 timing class;
      # they are not rerun here as accidental stress. Clean DNS/
      # connect failures self-skip (transient third-party downtime);
      # content, protocol, and TLS failures remain blocking, which is
      # the point. Post-merge ci.yml still runs these paths on every platform.
      - name: lwpt test --bail=1 (E2E project paths, live network)
        timeout-minutes: 15
        env:
          LWPT_ENABLE_NETWORK: "1"
        run: >-
          ./build/lwpt test
          'tests/e2e/*.Test.pas'
          'packages/*/tests/e2e/*.Test.pas'
          --bail=1

  docs:
    needs: delivery-gate
    if: ${{ needs.delivery-gate.outputs.deferred != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: "**/*.md"

      - name: Exercise repository workflow fixtures
        run: |
          python3 -m unittest discover -s .github/delivery/tests -v
          python3 -m unittest discover -s .github/tests -v

  # PR-gate extension (#102): one native aarch64-darwin leg. The #105
  # env-race family and its masks all first surfaced on darwin legs,
  # and darwin-only runtime breaks (the fpc-proxy misroute) were
  # invisible to the Linux-only gate. Native
  # bootstrap via brew keeps this independent of the cross-toolchain
  # cache. Ordinary paths only; E2E stays on the Linux leg above and on
  # post-merge ci.yml. Cost bound: ~5-6 min warm (brew fpc ~40 s +
  # bootstrap ~1 min + ordinary tests). The remaining ci.yml-only legs
  # (x86_64-darwin, aarch64-linux, i386-win32) stay post-merge: their
  # unique-catch rate has not justified per-PR cost.
  darwin-test:
    needs: delivery-gate
    if: ${{ needs.delivery-gate.outputs.deferred != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install FPC (brew)
        run: |
          brew list fpc >/dev/null 2>&1 || brew install fpc
          fpc -iV

      - name: Bootstrap lwpt
        run: ./bootstrap.sh

      - name: lwpt install --frozen (committed lockfile matches committed trees?)
        run: ./build/lwpt install --frozen

      - name: lwpt install (workspace auto-discovery + symlinks)
        run: ./build/lwpt install

      - name: lwpt test --bail=1 (ordinary project paths)
        run: >-
          ./build/lwpt test
          'source/*.Test.pas'
          'packages/*/source/*.Test.pas'
          'tests/integration/*.Test.pas'
          --bail=1

  # Reuses toolchain.yml exactly like ci.yml/release.yml do. The cache
  # key (lwpt-fpc-cross-<fpc>-macos-arm64-<n>) has no branch or ref
  # component, and GitHub Actions lets PR runs restore caches created
  # on the base branch — so PR runs hit the toolchain that ci.yml's
  # main pushes keep warm and this job is a few-second cache lookup.
  # Cold cache (eviction) ⇒ the PR run rebuilds it (~30 min, saved to
  # the PR's own cache scope); the next main push repopulates the
  # shared copy.
  toolchain:
    needs: delivery-gate
    if: ${{ needs.delivery-gate.outputs.deferred != 'true' }}
    uses: ./.github/workflows/toolchain.yml

  # Windows compile signal, pre-merge. ci.yml's full cross-build
  # matrix runs only on push to main, so without this job a
  # Windows-only compile error inside {$IFDEF WINDOWS} blocks merges
  # green and breaks main (see the header comment). One target is
  # enough: win32 and win64 share the same {$IFDEF WINDOWS} sources,
  # and the failure class is compile-time. The produced lwpt.exe is
  # uploaded for the windows-test job below, which runs the ordinary
  # project paths against it natively (same build-once / test-natively
  # split as ci.yml).
  #
  # The compile step mirrors ci.yml's build stage (x86_64-win64 leg):
  # same cross-FPC, same flags, same unit paths — minus the
  # Linux/Darwin branches that don't apply to win64. When ci.yml's
  # build flags change, change them here too.
  windows-cross-compile:
    if: >-
      ${{
        always() &&
        needs.delivery-gate.outputs.deferred != 'true' &&
        needs.toolchain.result == 'success'
      }}
    needs:
      - delivery-gate
      - toolchain
    runs-on: macos-latest
    env:
      # Single source of truth is toolchain.yml's FPC_VERSION (called
      # workflows do not inherit caller env); consuming the output
      # keeps this job in lockstep with the cache it restores.
      FPC_VERSION: ${{ needs.toolchain.outputs.fpc-version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Restore toolchain cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: ${{ needs.toolchain.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cross-compile lwpt for x86_64-win64
        run: |
          set -euo pipefail
          PREFIX="$PWD/fpc-cross"
          export PATH="$PREFIX/bin:$PATH"

          TARGET="x86_64-win64"
          CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppcrossx64"
          if [ ! -f "$CROSS_FPC" ]; then
            echo "::error::ppcrossx64 missing from the restored toolchain cache"
            exit 1
          fi

          # RTL + package paths, same slice as ci.yml's build stage.
          # ci.yml's conditional rtl-extra / hash -Fu additions are
          # omitted on purpose: toolchain.yml never produces those
          # unit dirs for cross targets (win64's crc.ppu lands in
          # paszlib/, winsock2.ppu in rtl/) — they exist only in the
          # brew-seeded aarch64-darwin units.
          RTL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl"
          OBJPAS_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-objpas"
          GEN_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-generics"
          FCL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/fcl-process"
          PASZLIB_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/paszlib"
          FCL_BASE_SRC="$PREFIX/share/fpcsrc/packages/fcl-base/src"
          FCL_NET_SRC="$PREFIX/share/fpcsrc/packages/fcl-net/src"
          OPENSSL_SRC="$PREFIX/share/fpcsrc/packages/openssl/src"

          for dir in "$RTL_DIR" "$OBJPAS_DIR" "$GEN_DIR" "$FCL_DIR" "$PASZLIB_DIR" \
                     "$FCL_BASE_SRC" "$FCL_NET_SRC" "$OPENSSL_SRC"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing directory for ${TARGET}: ${dir}"
              exit 1
            fi
          done
          if [ ! -f "$RTL_DIR/winsock2.ppu" ]; then
            echo "::error::Missing winsock2.ppu in ${RTL_DIR} for ${TARGET}"
            exit 1
          fi

          mkdir -p build/compiled

          echo "=== Building lwpt for ${TARGET} ==="
          "$CROSS_FPC" -Twin64 -O4 -dPRODUCTION -Xs -Xm -CX -XX -B \
            -Sh \
            -Fusource -Fisource \
            -Fupackages/httpclient/source -Fipackages/httpclient/source \
            -Fupackages/cli/source        -Fipackages/cli/source \
            -Fupackages/semver/source     -Fipackages/semver/source \
            -Fupackages/toml/source       -Fipackages/toml/source \
            -Fupackages/testing/source    -Fipackages/testing/source \
            -Fu"$RTL_DIR" -Fu"$OBJPAS_DIR" -Fu"$GEN_DIR" -Fu"$FCL_DIR" -Fu"$PASZLIB_DIR" \
            -Fu"$FCL_BASE_SRC" -Fu"$FCL_NET_SRC" -Fu"$OPENSSL_SRC" \
            -FU"build/compiled" -FE"build" \
            -dFPC_SOFT_FPUX80 \
            source/lwpt.pas

          if [ ! -f build/lwpt.exe ]; then
            echo "::error::Cross-compile produced no build/lwpt.exe"
            exit 1
          fi
          ls -la build/

      - name: Check Windows TLS linkage (native SChannel, no OpenSSL)
        run: |
          set -euo pipefail
          # The checker is a HOST InstantFPC program that only reads the
          # already-built PE + map. The cross toolchain in fpc-cross/ cannot
          # link a host binary on this macOS runner (ld: library 'c' not
          # found), so use a host-linkable FPC (brew puts instantfpc on PATH).
          brew list fpc >/dev/null 2>&1 || brew install fpc
          instantfpc packages/httpclient/scripts/check-windows-tls-imports.pas \
            --self-test
          instantfpc packages/httpclient/scripts/check-windows-tls-imports.pas \
            build/lwpt.exe --map build/lwpt.map

      - name: Upload lwpt.exe for the native test job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lwpt-pr-x86_64-win64
          retention-days: 1
          path: build/lwpt.exe

  # Native Windows test run, pre-merge. Downloads the cross-built
  # lwpt.exe and runs the offline ordinary paths on windows-latest:
  # lwpt install + lwpt test. This catches what a compile alone
  # cannot — Windows-only runtime regressions in lwpt itself
  # (junction-vs-symlink installs, path handling, subprocess
  # environment handling) and compile breaks in test sources, which
  # lwpt test compiles with the native FPC at run time (Q22=b).
  # Post-merge ci.yml still owns the i386-win32 leg, E2E paths
  # on non-Linux platforms, and the bootstrap.bat smoke.
  windows-test:
    if: >-
      ${{
        always() &&
        needs.delivery-gate.outputs.deferred != 'true' &&
        needs.windows-cross-compile.result == 'success'
      }}
    needs:
      - delivery-gate
      - windows-cross-compile
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # persist-credentials: false — this job downloads and EXECUTES
      # the PR-built lwpt.exe; keep git auth material out of the
      # workspace git config. No step here needs authenticated git.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # lwpt test compiles *.Test.pas with the native FPC. The shared setup
      # script pins the official distribution and publishes its unit paths.
      - name: Install FPC (official distribution)
        run: .github/delivery/install-windows-fpc.sh

      - name: Download lwpt artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lwpt-pr-x86_64-win64
          path: build/

      - name: Sanity check — lwpt --help
        run: ./build/lwpt.exe --help

      # The only leg that exercises the verifier on a CRLF-defaulting,
      # word-sorting host. It gates all three platform pins this PR
      # carries: the constraint-fingerprint separator + ordinal line
      # sort, the tree-hash content normalization, and the tree-hash
      # FOLD ORDER (TreeHashPathCompare — AnsiCompareText word-sorts
      # hyphenated names differently on Windows, which was the actual
      # cause of the "tree hash mismatch" here, reproduced byte-for-byte
      # from the divergent digests).
      - name: lwpt install --frozen (POSIX-written lockfile verifies on Windows?)
        run: ./build/lwpt.exe install --frozen

      - name: lwpt install (workspace auto-discovery + junctions)
        run: ./build/lwpt.exe install

      - name: lwpt test --bail=1 (ordinary project paths)
        run: >-
          ./build/lwpt.exe test
          'source/*.Test.pas'
          'packages/*/source/*.Test.pas'
          'tests/integration/*.Test.pas'
          --bail=1

  delivery-admission:
    if: ${{ always() }}
    needs:
      - delivery-gate
      - build-and-test
      - docs
      - darwin-test
      - toolchain
      - windows-cross-compile
      - windows-test
    runs-on: ubuntu-latest
    steps:
      - name: Require the native PR gate
        env:
          DEFERRED: ${{ needs.delivery-gate.outputs.deferred }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          DOCS: ${{ needs.docs.result }}
          DARWIN_TEST: ${{ needs.darwin-test.result }}
          TOOLCHAIN: ${{ needs.toolchain.result }}
          WINDOWS_CROSS_COMPILE: ${{ needs.windows-cross-compile.result }}
          WINDOWS_TEST: ${{ needs.windows-test.result }}
        run: |
          set -euo pipefail
          if [ "$DEFERRED" = "true" ]; then
            echo '::error::Managed delivery is deferred until its explicit ci transition.'
            exit 1
          fi
          for result in \
            "$BUILD_AND_TEST" "$DOCS" "$DARWIN_TEST" "$TOOLCHAIN" \
            "$WINDOWS_CROSS_COMPILE" "$WINDOWS_TEST"; do
            if [ "$result" != "success" ]; then
              echo "::error::A native PR job concluded $result."
              exit 1
            fi
          done
