name: CI
run-name: >-
  ${{ format('CI / {0} / {1}', github.event_name,
      github.head_ref || github.ref_name) }}

# The one CI workflow for code changes; release.yml owns tag pushes.
#
#   pull_request      — every PR, whatever its base branch (a native stacked
#                       PR targets the branch below it): the full native
#                       matrix on the PR's head. delivery-admission, the
#                       ruleset's single required check, passes only when
#                       every job succeeded.
#   push to main      — the same matrix on the squash commit: a delivery's
#                       integration evidence.
#   workflow_dispatch — the same full matrix on any ref (dispatch requires
#                       write access), never cancelled: this is how a
#                       coverage sampler fills in main commits whose push
#                       runs were superseded.
#   workflow_call     — only from diagnostic.yml: one allow-listed
#                       target/selector slice for remediation. Its runs
#                       belong to the Diagnostic workflow and its checks are
#                       named "diagnose / <job>", so a slice can never stand
#                       in for delivery-admission or for a ci.yml run on main.
#
#   build:  Cross-compile the lwpt binary on macos-latest for each of
#           six targets using the cross-FPC toolchain produced by
#           toolchain.yml (cached via the lwpt-fpc-cross-* key).
#           Per-target artefacts are the lwpt binary itself; tests
#           compile at run time on the native runner (Q22=b).
#
#   test:   Per-platform native runners — install FPC via the
#           platform's package manager, download the cross-built lwpt
#           binary, then run the
#           full pipeline:
#             ./build/lwpt install --frozen
#             ./build/lwpt install
#             ./build/lwpt test <ordinary paths> --bail=0
#             ./build/lwpt test <E2E paths> --bail=0  (live network, Q23=c)
#           plus cold bootstrap.bat (x86_64-win64) and bootstrap.sh
#           (aarch64-darwin) smokes.
#           This exercises lwpt itself + the underlying native FPC on
#           each platform end-to-end, including live GitHub/GitLab/
#           Bitbucket fetches.
#
#   native: Ubuntu with the distro FPC: bootstrap.sh, committed-state,
#           formatting, build-entry and AGENTS.md checks, then the
#           ordinary, E2E and inventory-only test passes against the
#           checked dev-mode binary.
#
#   docs:   Markdown lint and the CI tooling's unit tests.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      diagnostic_target:
        description: Native target for the diagnostic slice
        required: true
        type: string
      diagnostic_selector:
        description: Allow-listed test scope for the diagnostic slice
        required: true
        type: string

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Rapid merges still create
# distinct main commits; only the latest integrated-main verification keeps
# running. A dispatched full matrix is never cancelled, so it covers the
# commit it was started on. diagnostic.yml owns a slice's concurrency; the
# called run's own group must differ from the caller's.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'integrated-main' ||
        github.event_name == 'pull_request' &&
        format('pr-{0}', github.event.pull_request.number) ||
        format('ci-dispatch-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      diagnostic: ${{ steps.route.outputs.diagnostic }}
      build-matrix: ${{ steps.route.outputs.build-matrix }}
      test-matrix: ${{ steps.route.outputs.test-matrix }}
    steps:
      - name: Validate diagnostic inputs
        env:
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
          DIAGNOSTIC_SELECTOR: ${{ inputs.diagnostic_selector }}
        run: |
          set -euo pipefail
          if [ -n "$DIAGNOSTIC_TARGET" ]; then
            case "$DIAGNOSTIC_TARGET" in
              aarch64-darwin|x86_64-darwin|x86_64-linux|x86_64-win64|i386-win32) ;;
              *) echo "::error::unsupported diagnostic target: $DIAGNOSTIC_TARGET"; exit 1 ;;
            esac
            case "$DIAGNOSTIC_SELECTOR" in
              default|e2e|scheduling|tls) ;;
              *) echo "::error::unsupported diagnostic selector: $DIAGNOSTIC_SELECTOR"; exit 1 ;;
            esac
            case "$DIAGNOSTIC_TARGET/$DIAGNOSTIC_SELECTOR" in
              aarch64-darwin/scheduling|\
              x86_64-darwin/default|x86_64-darwin/scheduling|\
              x86_64-linux/scheduling|\
              x86_64-win64/default|x86_64-win64/e2e|x86_64-win64/tls|\
              i386-win32/default|i386-win32/e2e|i386-win32/tls) ;;
              *) echo "::error::unsupported diagnostic slice: $DIAGNOSTIC_TARGET/$DIAGNOSTIC_SELECTOR"; exit 1 ;;
            esac
          elif [ -n "$DIAGNOSTIC_SELECTOR" ]; then
            echo "::error::diagnostic selector $DIAGNOSTIC_SELECTOR needs a diagnostic target"
            exit 1
          fi

      - name: Select exact matrix
        id: route
        env:
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
        run: |
          set -euo pipefail
          if [ -n "$DIAGNOSTIC_TARGET" ]; then
            DIAGNOSTIC=true
            case "$DIAGNOSTIC_TARGET" in
              aarch64-darwin)
                BUILD='{"include":[{"target":"aarch64-darwin","cpu":"aarch64","os":"darwin","native":true}]}'
                TEST='{"include":[{"target":"aarch64-darwin","runner":"macos-latest","fpc-install":"brew"}]}'
                ;;
              x86_64-darwin)
                BUILD='{"include":[{"target":"x86_64-darwin","cpu":"x86_64","os":"darwin"}]}'
                TEST='{"include":[{"target":"x86_64-darwin","runner":"macos-15-intel","fpc-install":"brew"}]}'
                ;;
              x86_64-linux)
                BUILD='{"include":[{"target":"x86_64-linux","cpu":"x86_64","os":"linux"}]}'
                TEST='{"include":[{"target":"x86_64-linux","runner":"ubuntu-latest","fpc-install":"apt"}]}'
                ;;
              x86_64-win64)
                BUILD='{"include":[{"target":"x86_64-win64","cpu":"x86_64","os":"win64"}]}'
                TEST='{"include":[{"target":"x86_64-win64","runner":"windows-latest","fpc-install":"official"}]}'
                ;;
              i386-win32)
                BUILD='{"include":[{"target":"i386-win32","cpu":"i386","os":"win32"}]}'
                TEST='{"include":[{"target":"i386-win32","runner":"windows-latest","fpc-install":"official"}]}'
                ;;
            esac
          else
            DIAGNOSTIC=false
            BUILD='{"include":[{"target":"aarch64-darwin","cpu":"aarch64","os":"darwin","native":true},{"target":"x86_64-darwin","cpu":"x86_64","os":"darwin"},{"target":"x86_64-linux","cpu":"x86_64","os":"linux"},{"target":"aarch64-linux","cpu":"aarch64","os":"linux"},{"target":"x86_64-win64","cpu":"x86_64","os":"win64"},{"target":"i386-win32","cpu":"i386","os":"win32"}]}'
            TEST='{"include":[{"target":"aarch64-darwin","runner":"macos-latest","fpc-install":"brew","bootstrap-check":true},{"target":"x86_64-darwin","runner":"macos-15-intel","fpc-install":"brew"},{"target":"x86_64-linux","runner":"ubuntu-latest","fpc-install":"apt"},{"target":"aarch64-linux","runner":"ubuntu-24.04-arm","fpc-install":"apt"},{"target":"x86_64-win64","runner":"windows-latest","fpc-install":"official","bootstrap-check":true},{"target":"i386-win32","runner":"windows-latest","fpc-install":"official"}]}'
          fi
          {
            echo "diagnostic=$DIAGNOSTIC"
            echo "build-matrix=$BUILD"
            echo "test-matrix=$TEST"
          } >> "$GITHUB_OUTPUT"

  toolchain:
    needs: validate-inputs
    uses: ./.github/workflows/toolchain.yml

  build:
    needs:
      - validate-inputs
      - toolchain
    runs-on: macos-latest
    env:
      # Sourced from toolchain.yml (the single source of truth) so the
      # paths probed below always match the restored cache.
      FPC_VERSION: ${{ needs.toolchain.outputs.fpc-version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-inputs.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore toolchain cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: ${{ needs.toolchain.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cross-compile lwpt
        run: |
          set -euo pipefail
          PREFIX="$PWD/fpc-cross"
          export PATH="$PREFIX/bin:$PWD/cross-binutils/bin:$PATH"

          CPU="${{ matrix.cpu }}"
          OS="${{ matrix.os }}"
          TARGET="${CPU}-${OS}"
          NATIVE="${{ matrix.native }}"

          echo "Target: ${TARGET}"

          if [ "$NATIVE" = "true" ]; then
            CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppca64"
          else
            case "$CPU" in
              x86_64)  CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppcrossx64" ;;
              i386)    CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppcross386" ;;
              aarch64) CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppca64" ;;
            esac
          fi

          # Linker flags per target.
          EXTRA_FLAGS=""
          case "$OS" in
            linux)
              LIBDIR=$(find "$PWD/cross-libs/${CPU}-linux" -name "libc.so" -exec dirname {} \; | head -1)
              if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in cross-libs/${CPU}-linux"; exit 1; fi
              EXTRA_FLAGS="-XP${CPU}-linux- -Fl${LIBDIR}"
              ;;
            win32|win64)
              EXTRA_FLAGS="-Xm"
              ;;
            darwin)
              SDK_ROOT="$(xcrun --show-sdk-path)"
              SDK_LIB="${SDK_ROOT}/usr/lib"
              SDK_FRAMEWORKS="${SDK_ROOT}/System/Library/Frameworks"
              EXTRA_FLAGS="-Fl${SDK_LIB} -k-F${SDK_FRAMEWORKS}"
              ;;
          esac

          # RTL + package paths per target.
          RTL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl"
          RTL_EXTRA_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-extra"
          OBJPAS_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-objpas"
          GEN_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-generics"
          FCL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/fcl-process"
          PASZLIB_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/paszlib"
          HASH_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/hash"
          FCL_BASE_SRC="$PREFIX/share/fpcsrc/packages/fcl-base/src"
          FCL_NET_SRC="$PREFIX/share/fpcsrc/packages/fcl-net/src"
          OPENSSL_SRC="$PREFIX/share/fpcsrc/packages/openssl/src"
          HASH_FLAGS=""
          if [ -d "$HASH_DIR" ]; then
            HASH_FLAGS="-Fu${HASH_DIR}"
            echo "hash units: $(find "$HASH_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ') .ppu files"
          fi
          RTL_EXTRA_FLAGS=""
          if [ -d "$RTL_EXTRA_DIR" ]; then
            RTL_EXTRA_FLAGS="-Fu${RTL_EXTRA_DIR}"
            echo "rtl-extra units: $(find "$RTL_EXTRA_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ') .ppu files"
          fi

          require_dir() {
            local dir="$1"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing directory for ${TARGET}: ${dir}"
              exit 1
            fi
          }

          require_unit() {
            local dir="$1"
            local unit="$2"
            if [ ! -f "$dir/${unit}.ppu" ]; then
              echo "::error::Missing ${unit}.ppu in ${dir} for ${TARGET}"
              exit 1
            fi
          }

          echo "RTL units: $(ls "$RTL_DIR"/*.ppu 2>/dev/null | wc -l) .ppu files"
          require_dir "$OBJPAS_DIR"
          require_dir "$GEN_DIR"
          require_dir "$FCL_DIR"
          require_dir "$PASZLIB_DIR"
          require_dir "$FCL_BASE_SRC"
          require_dir "$FCL_NET_SRC"
          require_dir "$OPENSSL_SRC"
          PASZLIB_COUNT="$(find "$PASZLIB_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ')"
          echo "paszlib units: ${PASZLIB_COUNT} .ppu files"
          for unit in strutils dateutils variants; do
            require_unit "$OBJPAS_DIR" "$unit"
          done
          for unit in generics.collections generics.defaults; do
            require_unit "$GEN_DIR" "$unit"
          done
          for unit in process pipes; do
            require_unit "$FCL_DIR" "$unit"
          done
          # zdeflate backs the canonical tar.gz writer (ADR-0049); zinflate
          # backs the gzip and zip readers.
          for unit in zstream zdeflate zinflate; do
            require_unit "$PASZLIB_DIR" "$unit"
          done
          if [ ! -f "$PASZLIB_DIR/crc.ppu" ] && [ ! -f "$HASH_DIR/crc.ppu" ]; then
            echo "::error::Missing crc.ppu in paszlib/hash unit dirs for ${TARGET}"
            exit 1
          fi
          case "$OS" in
            win32|win64) require_unit "$RTL_DIR" winsock2 ;;
            *)
              if [ ! -f "$RTL_DIR/sockets.ppu" ] && [ ! -f "$RTL_EXTRA_DIR/sockets.ppu" ]; then
                echo "::error::Missing sockets.ppu in rtl/rtl-extra unit dirs for ${TARGET}"
                exit 1
              fi
              ;;
          esac

          mkdir -p build/compiled

          # Single entry point: source/lwpt.pas. -Fu / -Fi paths mirror
          # scripts/bootstrap.pas (LWPT's own bootstrap), extended with
          # the cross-toolchain RTL + packages.
          # Mirrored by release.yml's build job — flag or unit-path
          # changes here must be copied there.
          echo ""
          echo "=== Building lwpt for ${TARGET} ==="
          "$CROSS_FPC" -T"${OS}" -O4 -dPRODUCTION -Xs -CX -XX -B \
            -Sh \
            -Fusource -Fisource \
            -Fupackages/httpclient/source -Fipackages/httpclient/source \
            -Fupackages/cli/source        -Fipackages/cli/source \
            -Fupackages/semver/source     -Fipackages/semver/source \
            -Fupackages/toml/source       -Fipackages/toml/source \
            -Fupackages/testing/source    -Fipackages/testing/source \
            -Fu"$RTL_DIR" $RTL_EXTRA_FLAGS -Fu"$OBJPAS_DIR" -Fu"$GEN_DIR" -Fu"$FCL_DIR" -Fu"$PASZLIB_DIR" $HASH_FLAGS \
            -Fu"$FCL_BASE_SRC" -Fu"$FCL_NET_SRC" -Fu"$OPENSSL_SRC" \
            -FU"build/compiled" -FE"build" \
            $EXTRA_FLAGS \
            -dFPC_SOFT_FPUX80 \
            source/lwpt.pas

          echo ""
          echo "=== Build artefacts for ${TARGET} ==="
          ls -la build/

      - name: Check Windows TLS linkage (native SChannel, no OpenSSL)
        if: matrix.os == 'win64' || matrix.os == 'win32'
        run: |
          set -euo pipefail
          # The checker is a HOST InstantFPC program that only reads the
          # already-built PE + map. The cross toolchain in fpc-cross/ cannot
          # link a host binary on this macOS runner (ld: library 'c' not
          # found), so use a host-linkable FPC (brew puts instantfpc on PATH).
          brew list fpc >/dev/null 2>&1 || brew install fpc
          instantfpc packages/httpclient/scripts/check-windows-tls-imports.pas \
            --self-test
          instantfpc packages/httpclient/scripts/check-windows-tls-imports.pas \
            build/lwpt.exe --map build/lwpt.map

      - name: Stage artefact
        run: |
          mkdir -p ci-artifacts
          # Pick whichever binary name FPC produced (Unix vs Windows).
          for candidate in build/lwpt build/lwpt.exe; do
            if [ -f "$candidate" ]; then
              cp "$candidate" ci-artifacts/
            fi
          done
          if [ -z "$(ls -A ci-artifacts/ 2>/dev/null)" ]; then
            echo "::error::No lwpt binary found in build/"
            exit 1
          fi
          # Strip when the toolchain supports it (cross-platform via llvm-strip).
          for bin in ci-artifacts/*; do
            llvm-strip "$bin" 2>/dev/null || strip "$bin" 2>/dev/null || true
          done
          ls -la ci-artifacts/

      - name: Upload build artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lwpt-${{ matrix.target }}
          retention-days: 7
          path: ci-artifacts/*

  test:
    needs:
      - validate-inputs
      - build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-inputs.outputs.test-matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install FPC (brew)
        if: matrix.fpc-install == 'brew'
        run: |
          brew install fpc
          fpc -iV

      - name: Install FPC (apt)
        if: matrix.fpc-install == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      # The argument selects the compiler for test programs: the official
      # i386 native compiler on i386-win32, its x86_64 cross compiler
      # (ppcrossx64) on x86_64-win64 (#329).
      - name: Install FPC (official distribution)
        if: matrix.fpc-install == 'official'
        env:
          LWPT_WINDOWS_TEST_TARGET: ${{ matrix.target }}
        run: .github/ci/install-windows-fpc.sh "$LWPT_WINDOWS_TEST_TARGET"

      # The README's macOS path: a cold bootstrap.sh build with brew FPC.
      # build/ is removed again so the rest of the job validates the
      # downloaded cross-built artefact.
      - name: bootstrap.sh (macOS cold build)
        if: >-
          matrix.bootstrap-check == true && runner.os == 'macOS' &&
          needs.validate-inputs.outputs.diagnostic != 'true'
        run: |
          ./bootstrap.sh
          ./build/lwpt --help
          rm -rf build

      - name: bootstrap.bat (Windows cold build)
        if: >-
          matrix.bootstrap-check == true && runner.os == 'Windows' &&
          needs.validate-inputs.outputs.diagnostic != 'true'
        shell: cmd
        run: |
          rem Exercise bootstrap.bat's direct-fpc fallback path. This cmd
          rem smoke runs outside the Git Bash setup context, so pass the
          rem CI-discovered FPC unit paths through a temporary wrapper.
          set "BOOTSTRAP_PATH=%RUNNER_TEMP%\lwpt-bootstrap-path"
          if not exist "%BOOTSTRAP_PATH%" mkdir "%BOOTSTRAP_PATH%"
          > "%BOOTSTRAP_PATH%\fpc.cmd" echo @echo off
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo setlocal enabledelayedexpansion
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo set "UNIT_ARGS="
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo if defined LWPT_FPC_UNIT_PATHS for %%%%D in ("!LWPT_FPC_UNIT_PATHS:;=" "!") do set "UNIT_ARGS=!UNIT_ARGS! -Fu%%%%~D"
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo "%LWPT_FPC%" !UNIT_ARGS! %%*
          rem Keep this fallback smoke isolated from the native FPC bin that
          rem the install step publishes for the later direct-command tests.
          set "PATH=%BOOTSTRAP_PATH%;%SystemRoot%\system32;%SystemRoot%;%SystemRoot%\System32\Wbem"
          where instantfpc >nul 2>nul
          if not errorlevel 1 (
            echo bootstrap fallback smoke unexpectedly resolved instantfpc 1>&2
            exit /b 1
          )
          where fpc
          if errorlevel 1 exit /b %errorlevel%
          call bootstrap.bat
          if errorlevel 1 exit /b %errorlevel%
          build\lwpt.exe --help
          if errorlevel 1 exit /b %errorlevel%
          rmdir /s /q build
          rem Exercise bootstrap.bat's preferred InstantFPC path with the
          rem pinned FPC bin, then self-host twice: each rebuild replaces the
          rem build\lwpt.exe image it is running from (issue #331).
          for %%F in ("%LWPT_FPC%") do set "FPC_BIN=%%~dpF"
          set "PATH=%FPC_BIN%;%SystemRoot%\system32;%SystemRoot%;%SystemRoot%\System32\Wbem"
          where instantfpc
          if errorlevel 1 exit /b %errorlevel%
          call bootstrap.bat
          if errorlevel 1 exit /b %errorlevel%
          if exist build\lwpt (
            echo bootstrap InstantFPC path wrote build\lwpt without .exe 1>&2
            exit /b 1
          )
          build\lwpt.exe install --frozen
          if errorlevel 1 exit /b %errorlevel%
          build\lwpt.exe build lwpt
          if errorlevel 1 exit /b %errorlevel%
          build\lwpt.exe build lwpt
          if errorlevel 1 exit /b %errorlevel%
          build\lwpt.exe --help
          if errorlevel 1 exit /b %errorlevel%
          rmdir /s /q build

      - name: Download lwpt artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lwpt-${{ matrix.target }}
          path: build/

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x build/lwpt

      - name: Sanity check — lwpt --help
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe --help
          else
            ./build/lwpt --help
          fi

      # Before the plain install, which rewrites lwpt.lock on the runner and
      # so could never detect a committed lockfile that drifted from the
      # committed trees. On Windows this is the leg that verifies a
      # POSIX-written lockfile on a CRLF-defaulting, word-sorting host.
      - name: lwpt install --frozen (committed lockfile matches committed trees?)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe install --frozen
          else
            ./build/lwpt install --frozen
          fi

      - name: lwpt install (workspace auto-discovery + linking)
        id: workspace-install
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe install
          else
            ./build/lwpt install
          fi

      - name: lwpt test --bail=0 (ordinary project paths)
        if: >-
          needs.validate-inputs.outputs.diagnostic != 'true' ||
          (inputs.diagnostic_selector == 'default' &&
           inputs.diagnostic_target != 'x86_64-darwin')
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe test \
              'source/*.Test.pas' \
              'packages/*/source/*.Test.pas' \
              'tests/integration/*.Test.pas' \
              --bail=0
          else
            ./build/lwpt test \
              'source/*.Test.pas' \
              'packages/*/source/*.Test.pas' \
              'tests/integration/*.Test.pas' \
              --bail=0
          fi

      - name: lwpt test --bail=0 (E2E project paths, live network — every platform per Q23=c)
        # Run even when the ordinary queue failed, so one run reports both.
        if: >-
          !cancelled() && steps.workspace-install.outcome == 'success' &&
          (needs.validate-inputs.outputs.diagnostic != 'true' || inputs.diagnostic_selector == 'e2e')
        env:
          LWPT_ENABLE_NETWORK: "1"
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe test \
              'tests/e2e/*.Test.pas' \
              'packages/*/tests/e2e/*.Test.pas' \
              --bail=0
          else
            ./build/lwpt test \
              'tests/e2e/*.Test.pas' \
              'packages/*/tests/e2e/*.Test.pas' \
              --bail=0
          fi

      # The registry matrix keeps a failing case's scratch directory (data
      # directories, consumer projects, and command logs of loopback-only
      # test registries with throwaway keys).
      - name: Upload registry matrix scratch on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-matrix-${{ matrix.target }}
          path: build/tests/tmp/rmx-*
          if-no-files-found: ignore
          retention-days: 7

      - name: TLS diagnostic test
        if: needs.validate-inputs.outputs.diagnostic == 'true' && inputs.diagnostic_selector == 'tls'
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe test packages/httpclient/source/TransportSecurity.Test.pas --bail=1 --verbose
          else
            ./build/lwpt test packages/httpclient/source/TransportSecurity.Test.pas --bail=1 --verbose
          fi

      - name: Scheduling diagnostic test
        if: >-
          needs.validate-inputs.outputs.diagnostic == 'true' &&
          ((inputs.diagnostic_target == 'x86_64-darwin' &&
            inputs.diagnostic_selector == 'default') ||
           ((inputs.diagnostic_target == 'x86_64-darwin' ||
             inputs.diagnostic_target == 'aarch64-darwin') &&
            inputs.diagnostic_selector == 'scheduling') ||
           (inputs.diagnostic_target == 'x86_64-linux' &&
            inputs.diagnostic_selector == 'scheduling'))
        shell: bash
        env:
          LWPT_SCHEDULING_DIAGNOSTIC_SCOPE: ${{ inputs.diagnostic_selector }}
          LWPT_SCHEDULING_DIAGNOSTIC_POLL_COUNT: ${{ inputs.diagnostic_selector == 'default' && '84' || (inputs.diagnostic_target == 'x86_64-darwin' || inputs.diagnostic_target == 'aarch64-darwin') && '30' || '18' }}
        run: .github/ci/scheduling-diagnostic.sh

  # Builds the example registry image (docs/examples/registry) from a
  # release-shaped archive of the x86_64-linux binary under test and runs the
  # container smoke: pinned-checksum install, non-root runtime with a
  # read-only root and configuration, health check, operator commands in the
  # serving container, live publication from the runner, graceful stop and
  # container replacement on the same volume, and the reverse-proxy example.
  # Full matrix only; release.yml repeats it against the published assets.
  registry-container:
    needs:
      - validate-inputs
      - build
    if: needs.validate-inputs.outputs.diagnostic != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download lwpt artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lwpt-x86_64-linux
          path: build/

      # The smoke bounds each engine call and itself; the step bound and the
      # separate diagnostics step keep artifacts even if it is killed.
      - name: Registry container smoke
        timeout-minutes: 11
        env:
          ARTIFACTS: ${{ runner.temp }}/registry-container-artifacts
        run: |
          chmod +x build/lwpt
          timeout --kill-after=30 600 .github/ci/registry-container/smoke.sh --binary build/lwpt

      - name: Collect registry container diagnostics on failure
        if: failure()
        timeout-minutes: 4
        env:
          ARTIFACTS: ${{ runner.temp }}/registry-container-artifacts
        run: timeout --kill-after=10 200 .github/ci/registry-container/smoke.sh --collect

      - name: Upload registry container artifacts on failure
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-container-smoke
          path: ${{ runner.temp }}/registry-container-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The repository-level checks that need one platform. The distro FPC is
  # deliberate (the same as the install instructions in README.md): a
  # regression that only shows up with the system FPC's slightly older RTL
  # gets caught here, and bootstrap.sh gets a cold build.
  native:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.diagnostic != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install FPC (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Bootstrap (cold build of build/lwpt)
        run: ./bootstrap.sh

      - name: Test inventory documentation is generated
        run: instantfpc -Fu./source -Fi./source scripts/update-test-inventory.pas --check

      - name: lwpt install --frozen (committed lockfile matches committed trees?)
        run: ./build/lwpt install --frozen

      - name: lwpt install (workspace auto-discovery)
        run: ./build/lwpt install

      # Defense in depth for #370: --frozen re-derives every workspace
      # snapshot from its source, and this step fails if the plain install
      # above still changed any committed toolkit state it owns.
      - name: Committed toolkit state is current (plain install changed nothing?)
        run: |
          drift="$(git status --porcelain --untracked-files=all -- \
            lwpt.lock lwpt.cfg .lwpt/modules .lwpt/archives)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo "::error::lwpt install changed committed toolkit state; run ./build/lwpt install and commit the result"
            exit 1
          fi

      - name: lwpt format --check (formatting drift?)
        run: ./build/lwpt format --check

      - name: lwpt build (compile every [build] entry)
        run: ./build/lwpt build

      # Runs after `lwpt build` so the freshly compiled binary, the change's
      # own command surface, is what the committed AGENTS.md block is checked
      # against (ADR-0027).
      - name: lwpt agents --check (AGENTS.md command reference fresh?)
        id: agents-check
        run: ./build/lwpt agents --check

      # The test legs run the cross-built release binary. These passes run
      # the bootstrapped dev-mode binary instead, built with range, stack and
      # assertion checks (-Ct -Cr -Sa), which the subprocess tests spawn.
      - name: lwpt test --bail=0 (ordinary project paths, checked binary)
        run: >-
          ./build/lwpt test
          'source/*.Test.pas'
          'packages/*/source/*.Test.pas'
          'tests/integration/*.Test.pas'
          --bail=0

      - name: lwpt test --bail=0 (E2E project paths, live network, checked binary)
        # Run even when the ordinary queue failed, so one run reports both;
        # a failed setup step (bootstrap through agents --check) still skips it.
        if: ${{ !cancelled() && steps.agents-check.outcome == 'success' }}
        timeout-minutes: 15
        env:
          LWPT_ENABLE_NETWORK: "1"
        run: >-
          ./build/lwpt test
          'tests/e2e/*.Test.pas'
          'packages/*/tests/e2e/*.Test.pas'
          --bail=0

      # #381: the passes above verify registrations in report mode, which
      # runs test bodies. Inventory-only mode exits before them, so a program
      # whose startup misbehaves there escaped every gate. This pass lists
      # every discovered program from the executables the passes above
      # cached, compares each record with tests/test-inventory.tsv, and
      # checks that the published JSON parses.
      - name: lwpt test --inventory (inventory-only mode matches tests/test-inventory.tsv?)
        if: ${{ !cancelled() && steps.agents-check.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          ./build/lwpt test --inventory > "$RUNNER_TEMP/test-inventory.json"
          python3 -m json.tool "$RUNNER_TEMP/test-inventory.json" > /dev/null

  docs:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.diagnostic != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: "**/*.md"

      - name: Exercise CI tooling and workflow fixtures
        run: |
          python3 -m unittest discover -s .github/ci -v
          python3 -m unittest discover -s .github/tests -v

  # The single required status check (.github/rulesets/protect-main.json).
  # It runs even when a dependency fails or is skipped, and passes only when
  # every job succeeded, so the ruleset names one stable context. A
  # diagnostic is never admission evidence, so it does not run there.
  delivery-admission:
    if: ${{ always() && needs.validate-inputs.outputs.diagnostic != 'true' }}
    needs:
      - validate-inputs
      - toolchain
      - build
      - test
      - registry-container
      - native
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job concluded $result."
              exit 1
            fi
          done
