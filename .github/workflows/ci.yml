name: CI

# Two stages, mirroring the GocciaScript CI pattern (the upstream of
# LWPT's vendored units). Sister workflows:
#
#   pr.yml      — every PR: Ubuntu native bootstrap + build + test,
#                 plus a win64 leg (cross-compile + native offline
#                 test run; the pre-merge gate)
#   release.yml — tag-triggered cross-build + package + publish
#
# ci.yml runs ONLY on push to main + manual dispatch. PRs do not
# trigger ci.yml — pr.yml owns the PR flow, release.yml owns tag
# pushes. This mirrors GocciaScript's ci.yml shape (push-to-main +
# tags + workflow_dispatch — no pull_request) and avoids the
# duplicate-build cost that comes from triggering on both push and
# pull_request for the same commit. Post-merge, ci.yml runs once
# on main to confirm the merged tree is green.
#
#   build:  Cross-compile the lwpt binary on macos-latest for each of
#           six targets using the cross-FPC toolchain produced by
#           toolchain.yml (cached via the lwpt-fpc-cross-* key).
#           Per-target artefacts are the lwpt binary itself; tests
#           compile at run time on the native runner (Q22=b).
#
#   test:   Per-platform native runners — install FPC via the
#           platform's package manager, run a Windows bootstrap smoke
#           once, download the cross-built lwpt binary, then run the
#           full pipeline:
#             ./build/lwpt install
#             ./build/lwpt format --check        (one runner is enough)
#             ./build/lwpt test --bail=1             (default tier)
#             ./build/lwpt test --tier=e2e --bail=1  (live network, Q23=c)
#           This exercises lwpt itself + the underlying native FPC on
#           each platform end-to-end, including live GitHub/GitLab/
#           Bitbucket fetches.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain.yml

  build:
    needs: toolchain
    runs-on: macos-latest
    env:
      # Sourced from toolchain.yml (the single source of truth) so the
      # paths probed below always match the restored cache.
      FPC_VERSION: ${{ needs.toolchain.outputs.fpc-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            cpu: aarch64
            os: darwin
            native: true
          - target: x86_64-darwin
            cpu: x86_64
            os: darwin
          - target: x86_64-linux
            cpu: x86_64
            os: linux
          - target: aarch64-linux
            cpu: aarch64
            os: linux
          - target: x86_64-win64
            cpu: x86_64
            os: win64
          - target: i386-win32
            cpu: i386
            os: win32
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore toolchain cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: ${{ needs.toolchain.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cross-compile lwpt
        run: |
          set -euo pipefail
          PREFIX="$PWD/fpc-cross"
          export PATH="$PREFIX/bin:$PWD/cross-binutils/bin:$PATH"

          CPU="${{ matrix.cpu }}"
          OS="${{ matrix.os }}"
          TARGET="${CPU}-${OS}"
          NATIVE="${{ matrix.native }}"

          echo "Target: ${TARGET}"

          if [ "$NATIVE" = "true" ]; then
            CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppca64"
          else
            case "$CPU" in
              x86_64)  CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppcrossx64" ;;
              i386)    CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppcross386" ;;
              aarch64) CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppca64" ;;
            esac
          fi

          # Linker flags per target.
          EXTRA_FLAGS=""
          case "$OS" in
            linux)
              LIBDIR=$(find "$PWD/cross-libs/${CPU}-linux" -name "libc.so" -exec dirname {} \; | head -1)
              if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in cross-libs/${CPU}-linux"; exit 1; fi
              EXTRA_FLAGS="-XP${CPU}-linux- -Fl${LIBDIR}"
              ;;
            win32|win64)
              EXTRA_FLAGS=""
              ;;
            darwin)
              SDK_ROOT="$(xcrun --show-sdk-path)"
              SDK_LIB="${SDK_ROOT}/usr/lib"
              SDK_FRAMEWORKS="${SDK_ROOT}/System/Library/Frameworks"
              EXTRA_FLAGS="-Fl${SDK_LIB} -k-F${SDK_FRAMEWORKS}"
              ;;
          esac

          # RTL + package paths per target.
          RTL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl"
          RTL_EXTRA_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-extra"
          OBJPAS_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-objpas"
          GEN_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-generics"
          FCL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/fcl-process"
          PASZLIB_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/paszlib"
          HASH_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/hash"
          FCL_BASE_SRC="$PREFIX/share/fpcsrc/packages/fcl-base/src"
          FCL_NET_SRC="$PREFIX/share/fpcsrc/packages/fcl-net/src"
          OPENSSL_SRC="$PREFIX/share/fpcsrc/packages/openssl/src"
          HASH_FLAGS=""
          if [ -d "$HASH_DIR" ]; then
            HASH_FLAGS="-Fu${HASH_DIR}"
            echo "hash units: $(find "$HASH_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ') .ppu files"
          fi
          RTL_EXTRA_FLAGS=""
          if [ -d "$RTL_EXTRA_DIR" ]; then
            RTL_EXTRA_FLAGS="-Fu${RTL_EXTRA_DIR}"
            echo "rtl-extra units: $(find "$RTL_EXTRA_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ') .ppu files"
          fi

          require_dir() {
            local dir="$1"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing directory for ${TARGET}: ${dir}"
              exit 1
            fi
          }

          require_unit() {
            local dir="$1"
            local unit="$2"
            if [ ! -f "$dir/${unit}.ppu" ]; then
              echo "::error::Missing ${unit}.ppu in ${dir} for ${TARGET}"
              exit 1
            fi
          }

          echo "RTL units: $(ls "$RTL_DIR"/*.ppu 2>/dev/null | wc -l) .ppu files"
          require_dir "$OBJPAS_DIR"
          require_dir "$GEN_DIR"
          require_dir "$FCL_DIR"
          require_dir "$PASZLIB_DIR"
          require_dir "$FCL_BASE_SRC"
          require_dir "$FCL_NET_SRC"
          require_dir "$OPENSSL_SRC"
          PASZLIB_COUNT="$(find "$PASZLIB_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ')"
          echo "paszlib units: ${PASZLIB_COUNT} .ppu files"
          for unit in strutils dateutils variants; do
            require_unit "$OBJPAS_DIR" "$unit"
          done
          for unit in generics.collections generics.defaults; do
            require_unit "$GEN_DIR" "$unit"
          done
          for unit in process pipes; do
            require_unit "$FCL_DIR" "$unit"
          done
          require_unit "$PASZLIB_DIR" zstream
          if [ ! -f "$PASZLIB_DIR/crc.ppu" ] && [ ! -f "$HASH_DIR/crc.ppu" ]; then
            echo "::error::Missing crc.ppu in paszlib/hash unit dirs for ${TARGET}"
            exit 1
          fi
          case "$OS" in
            win32|win64) require_unit "$RTL_DIR" winsock2 ;;
            *)
              if [ ! -f "$RTL_DIR/sockets.ppu" ] && [ ! -f "$RTL_EXTRA_DIR/sockets.ppu" ]; then
                echo "::error::Missing sockets.ppu in rtl/rtl-extra unit dirs for ${TARGET}"
                exit 1
              fi
              ;;
          esac

          mkdir -p build/compiled

          # Single entry point: source/lwpt.pas. -Fu / -Fi paths mirror
          # scripts/bootstrap.pas (LWPT's own bootstrap), extended with
          # the cross-toolchain RTL + packages.
          # Mirrored by release.yml's build job AND pr.yml's
          # windows-cross-compile job (win64 leg) — flag or unit-path
          # changes here must be copied to both.
          echo ""
          echo "=== Building lwpt for ${TARGET} ==="
          "$CROSS_FPC" -T"${OS}" -O4 -dPRODUCTION -Xs -CX -XX -B \
            -Sh \
            -Fusource -Fisource \
            -Fupackages/httpclient/source -Fipackages/httpclient/source \
            -Fupackages/cli/source        -Fipackages/cli/source \
            -Fupackages/semver/source     -Fipackages/semver/source \
            -Fupackages/toml/source       -Fipackages/toml/source \
            -Fupackages/testing/source    -Fipackages/testing/source \
            -Fu"$RTL_DIR" $RTL_EXTRA_FLAGS -Fu"$OBJPAS_DIR" -Fu"$GEN_DIR" -Fu"$FCL_DIR" -Fu"$PASZLIB_DIR" $HASH_FLAGS \
            -Fu"$FCL_BASE_SRC" -Fu"$FCL_NET_SRC" -Fu"$OPENSSL_SRC" \
            -FU"build/compiled" -FE"build" \
            $EXTRA_FLAGS \
            -dFPC_SOFT_FPUX80 \
            source/lwpt.pas

          echo ""
          echo "=== Build artefacts for ${TARGET} ==="
          ls -la build/

      - name: Stage artefact
        run: |
          mkdir -p ci-artifacts
          # Pick whichever binary name FPC produced (Unix vs Windows).
          for candidate in build/lwpt build/lwpt.exe; do
            if [ -f "$candidate" ]; then
              cp "$candidate" ci-artifacts/
            fi
          done
          if [ -z "$(ls -A ci-artifacts/ 2>/dev/null)" ]; then
            echo "::error::No lwpt binary found in build/"
            exit 1
          fi
          # Strip when the toolchain supports it (cross-platform via llvm-strip).
          for bin in ci-artifacts/*; do
            llvm-strip "$bin" 2>/dev/null || strip "$bin" 2>/dev/null || true
          done
          ls -la ci-artifacts/

      - name: Upload build artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lwpt-${{ matrix.target }}
          retention-days: 7
          path: ci-artifacts/*

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-latest
            fpc-install: brew
            format-check: true     # one runner runs format-check (platform-independent)
          - target: x86_64-darwin
            runner: macos-15-intel
            fpc-install: brew
          - target: x86_64-linux
            runner: ubuntu-latest
            fpc-install: apt
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            fpc-install: apt
          - target: x86_64-win64
            runner: windows-latest
            fpc-install: choco
            bootstrap-check: true    # one Windows leg validates bootstrap.bat
          - target: i386-win32
            runner: windows-latest
            fpc-install: choco
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install FPC (brew)
        if: matrix.fpc-install == 'brew'
        run: |
          brew install fpc
          fpc -iV

      - name: Install FPC (apt)
        if: matrix.fpc-install == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      # Copied verbatim into pr.yml's windows-test job — when this
      # step changes, change that copy too.
      - name: Install FPC (choco)
        if: matrix.fpc-install == 'choco'
        run: |
          choco install -y freepascal
          # Add the FPC bin to PATH for subsequent steps. Chocolatey has
          # used both C:\fpc and C:\tools\freepascal layouts over time.
          FPC_BIN=""
          for candidate_root in /c/tools/freepascal /c/fpc; do
            if [ -d "$candidate_root" ]; then
              FPC_BIN=$(find "$candidate_root" -name fpc.exe -type f 2>/dev/null | head -1)
              if [ -n "$FPC_BIN" ]; then break; fi
            fi
          done
          if [ -z "$FPC_BIN" ]; then echo "::error::Chocolatey FPC install: fpc.exe not found"; exit 1; fi
          echo "Using FPC at $FPC_BIN"
          echo "$(dirname "$FPC_BIN")" >> "$GITHUB_PATH"
          echo "LWPT_FPC=$(cygpath -w "$FPC_BIN")" >> "$GITHUB_ENV"
          INSTANTFPC_BIN=$(find "$(dirname "$FPC_BIN")" -name instantfpc.exe -type f 2>/dev/null | head -1)
          if [ -n "$INSTANTFPC_BIN" ]; then
            echo "LWPT_INSTANTFPC=$(cygpath -w "$INSTANTFPC_BIN")" >> "$GITHUB_ENV"
          fi
          FPC_UNIT_PATHS=""
          for unit_dir in rtl rtl-objpas rtl-generics rtl-extra fcl-base fcl-process paszlib hash; do
            UNIT_PATH=""
            for unit_target in i386-win32 x86_64-win64; do
              UNIT_PATH=$(find /c/tools/freepascal /c/fpc -path "*/units/${unit_target}/${unit_dir}" -type d 2>/dev/null | head -1 || true)
              if [ -n "$UNIT_PATH" ]; then break; fi
            done
            if [ -n "$UNIT_PATH" ]; then
              UNIT_PATH_WIN=$(cygpath -w "$UNIT_PATH")
              if [ -z "$FPC_UNIT_PATHS" ]; then
                FPC_UNIT_PATHS="$UNIT_PATH_WIN"
              else
                FPC_UNIT_PATHS="${FPC_UNIT_PATHS};${UNIT_PATH_WIN}"
              fi
            fi
          done
          echo "LWPT_FPC_UNIT_PATHS=$FPC_UNIT_PATHS" >> "$GITHUB_ENV"

      - name: bootstrap.bat (Windows cold build)
        if: matrix.bootstrap-check == true
        shell: cmd
        run: |
          rem Exercise bootstrap.bat's direct-fpc fallback path. This cmd
          rem smoke runs outside the Git Bash setup context, so pass the
          rem CI-discovered FPC unit paths through a temporary wrapper.
          set "BOOTSTRAP_PATH=%RUNNER_TEMP%\lwpt-bootstrap-path"
          if not exist "%BOOTSTRAP_PATH%" mkdir "%BOOTSTRAP_PATH%"
          > "%BOOTSTRAP_PATH%\fpc.cmd" echo @echo off
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo setlocal enabledelayedexpansion
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo set "UNIT_ARGS="
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo if defined LWPT_FPC_UNIT_PATHS for %%%%D in ("!LWPT_FPC_UNIT_PATHS:;=" "!") do set "UNIT_ARGS=!UNIT_ARGS! -Fu%%%%~D"
          >> "%BOOTSTRAP_PATH%\fpc.cmd" echo "%LWPT_FPC%" !UNIT_ARGS! %%*
          set "PATH=%BOOTSTRAP_PATH%;%PATH%"
          call bootstrap.bat
          if errorlevel 1 exit /b %errorlevel%
          build\lwpt.exe --help
          if errorlevel 1 exit /b %errorlevel%
          rmdir /s /q build

      - name: Download lwpt artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lwpt-${{ matrix.target }}
          path: build/

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x build/lwpt

      - name: Sanity check — lwpt --help
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe --help
          else
            ./build/lwpt --help
          fi

      - name: Check Windows TLS imports (native client, runtime-loaded server)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Parse both normal and delay PE imports. The checker output is
          # captured before matching so pipeline short-circuiting cannot hide
          # a prohibited DLL.
          $path = "build/lwpt.exe"
          $python = Get-Command python3 -ErrorAction SilentlyContinue
          if (-not $python) {
            $python = Get-Command python -ErrorAction SilentlyContinue
          }
          if (-not $python) {
            throw "Python is required to inspect PE imports"
          }
          $checker = @'
          import struct
          import sys

          path = sys.argv[1]
          data = open(path, "rb").read()

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def u16(offset):
              require(offset + 2 <= len(data), "truncated uint16")
              return struct.unpack_from("<H", data, offset)[0]

          def u32(offset):
              require(offset + 4 <= len(data), "truncated uint32")
              return struct.unpack_from("<I", data, offset)[0]

          require(data[:2] == b"MZ", "missing DOS header")
          pe = u32(0x3c)
          require(data[pe:pe + 4] == b"PE\0\0", "missing PE header")
          sections_count = u16(pe + 6)
          optional_size = u16(pe + 20)
          optional = pe + 24
          magic = u16(optional)
          require(magic in (0x10b, 0x20b), "unsupported PE optional header")
          if magic == 0x10b:
              image_base = u32(optional + 28)
              directories_count = u32(optional + 92)
              directories = optional + 96
          else:
              require(optional + 32 <= len(data), "truncated PE32+ image base")
              image_base = struct.unpack_from("<Q", data, optional + 24)[0]
              directories_count = u32(optional + 108)
              directories = optional + 112
          size_of_headers = u32(optional + 60)
          section_table = optional + optional_size

          sections = []
          for index in range(sections_count):
              section = section_table + index * 40
              require(section + 40 <= len(data), "truncated section table")
              virtual_size = u32(section + 8)
              virtual_address = u32(section + 12)
              raw_size = u32(section + 16)
              raw_offset = u32(section + 20)
              sections.append((virtual_address, max(virtual_size, raw_size),
                               raw_offset, raw_size))

          def file_offset(rva):
              if rva < size_of_headers:
                  require(rva < len(data), "header RVA outside file")
                  return rva
              for virtual_address, span, raw_offset, raw_size in sections:
                  if virtual_address <= rva < virtual_address + span:
                      delta = rva - virtual_address
                      require(delta < raw_size and raw_offset + delta < len(data),
                              "RVA points outside raw section data")
                      return raw_offset + delta
              raise ValueError("unmapped RVA")

          def text_at(rva):
              offset = file_offset(rva)
              end = data.find(b"\0", offset)
              require(end >= 0, "unterminated DLL name")
              return data[offset:end].decode("ascii", "strict")

          def directory(index):
              if index >= directories_count:
                  return 0, 0
              entry = directories + index * 8
              require(entry + 8 <= optional + optional_size,
                      "truncated data directory")
              return u32(entry), u32(entry + 4)

          def imports():
              rva, size = directory(1)
              if rva == 0:
                  return
              offset = file_offset(rva)
              end = offset + size
              require(size >= 20 and end <= len(data), "invalid import directory")
              while offset + 20 <= end:
                  descriptor = data[offset:offset + 20]
                  if descriptor == b"\0" * 20:
                      return
                  yield "import", text_at(u32(offset + 12))
                  offset += 20
              raise ValueError("unterminated import directory")

          def delay_imports():
              rva, size = directory(13)
              if rva == 0:
                  return
              offset = file_offset(rva)
              end = offset + size
              require(size >= 32 and end <= len(data), "invalid delay-import directory")
              while offset + 32 <= end:
                  descriptor = data[offset:offset + 32]
                  if descriptor == b"\0" * 32:
                      return
                  attributes = u32(offset)
                  name_address = u32(offset + 4)
                  name_rva = name_address if attributes & 1 else name_address - image_base
                  require(name_rva >= 0, "invalid delay-import DLL address")
                  yield "delay-import", text_at(name_rva)
                  offset += 32
              raise ValueError("unterminated delay-import directory")

          try:
              entries = list(imports() or ()) + list(delay_imports() or ())
              for kind, name in entries:
                  print(f"{kind}: {name}")
          except (OSError, UnicodeError, ValueError) as error:
              print(f"PE import inspection failed: {error}", file=sys.stderr)
              sys.exit(2)
          '@
          $imports = (& $python.Source -c $checker $path 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "PE import checker could not inspect $path"
          }
          if ($imports -match "(?im)^(import|delay-import):\s.*(libssl|libcrypto)") {
            throw "lwpt.exe imports libssl/libcrypto; clients use SChannel (ADR-0016) and servers must runtime-load OpenSSL (ADR-0024)"
          }
          Write-Host "OK: no normal or delay libssl/libcrypto imports in lwpt.exe"

      - name: lwpt install (workspace auto-discovery + linking)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe install
          else
            ./build/lwpt install
          fi

      - name: lwpt format --check (one runner)
        if: matrix.format-check == true
        run: |
          ./build/lwpt format --check

      - name: lwpt test --bail=1 (default tier)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe test --bail=1
          else
            ./build/lwpt test --bail=1
          fi

      - name: lwpt test --tier=e2e --bail=1 (live network — every platform per Q23=c)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/lwpt.exe test --tier=e2e --bail=1
          else
            ./build/lwpt test --tier=e2e --bail=1
          fi
