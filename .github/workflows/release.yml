name: Release

# Tag-triggered release pipeline. Companion to ci.yml:
#
#   ci.yml      — push to main: build + test on every platform
#   release.yml — tag push: cross-build → package → publish GitHub Release
#   pr.yml      — fast PR feedback (system FPC + win64 cross-compile
#                 + native offline Windows test run)
#
# Triggers on tags matching:
#   v?[0-9]+.[0-9]+.[0-9]+         e.g.  0.1.0, 1.2.3 (canonical, no v)
#   v?[0-9]+.[0-9]+.[0-9]+-*       e.g.  0.1.0-rc.1   (canonical pre-release)
#
# Per ADR-0009, LWPT adopts SemVer 2.0.0 — the canonical tag form has
# NO leading `v`. The `v` prefix is accepted as a courtesy (so someone
# tagging `v0.1.0` doesn't hit a failed CI), and the version embedded
# in archive names strips it: `lwpt-0.1.0-linux-x64.tar.gz` regardless
# of whether the tag was `0.1.0` or `v0.1.0`.
#
# Reuses toolchain.yml (workflow_call) to avoid duplicating the
# expensive cross-FPC build. The build job mirrors ci.yml's `build`
# stage exactly so a tagged commit produces the same binaries the
# regular CI run would have.
#
# Pre-release detection: tags with a hyphen after the version
# (e.g. `1.0.0-rc.1`) are published as pre-releases. Stable tags
# (e.g. `1.0.0`) are published as full releases.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # softprops/action-gh-release needs this to create the release

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain.yml

  build:
    needs: toolchain
    runs-on: macos-latest
    env:
      # Sourced from toolchain.yml (the single source of truth) so the
      # paths probed below always match the restored cache.
      FPC_VERSION: ${{ needs.toolchain.outputs.fpc-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            cpu: aarch64
            os: darwin
            display: macos-arm64
            native: true
          - target: x86_64-darwin
            cpu: x86_64
            os: darwin
            display: macos-x64
          - target: x86_64-linux
            cpu: x86_64
            os: linux
            display: linux-x64
          - target: aarch64-linux
            cpu: aarch64
            os: linux
            display: linux-arm64
          - target: x86_64-win64
            cpu: x86_64
            os: win64
            display: windows-x64
          - target: i386-win32
            cpu: i386
            os: win32
            display: windows-x86
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore toolchain cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: ${{ needs.toolchain.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cross-compile lwpt
        run: |
          set -euo pipefail
          PREFIX="$PWD/fpc-cross"
          export PATH="$PREFIX/bin:$PWD/cross-binutils/bin:$PATH"

          CPU="${{ matrix.cpu }}"
          OS="${{ matrix.os }}"
          TARGET="${CPU}-${OS}"
          NATIVE="${{ matrix.native }}"

          echo "Target: ${TARGET}"

          if [ "$NATIVE" = "true" ]; then
            CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppca64"
          else
            case "$CPU" in
              x86_64)  CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppcrossx64" ;;
              i386)    CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppcross386" ;;
              aarch64) CROSS_FPC="$PREFIX/lib/fpc/${FPC_VERSION}/ppca64" ;;
            esac
          fi

          EXTRA_FLAGS=""
          case "$OS" in
            linux)
              LIBDIR=$(find "$PWD/cross-libs/${CPU}-linux" -name "libc.so" -exec dirname {} \; | head -1)
              if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in cross-libs/${CPU}-linux"; exit 1; fi
              EXTRA_FLAGS="-XP${CPU}-linux- -Fl${LIBDIR}"
              ;;
            win32|win64)
              EXTRA_FLAGS=""
              ;;
            darwin)
              SDK_ROOT="$(xcrun --show-sdk-path)"
              SDK_LIB="${SDK_ROOT}/usr/lib"
              SDK_FRAMEWORKS="${SDK_ROOT}/System/Library/Frameworks"
              EXTRA_FLAGS="-Fl${SDK_LIB} -k-F${SDK_FRAMEWORKS}"
              ;;
          esac

          RTL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl"
          RTL_EXTRA_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-extra"
          OBJPAS_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-objpas"
          GEN_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/rtl-generics"
          FCL_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/fcl-process"
          PASZLIB_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/paszlib"
          HASH_DIR="$PREFIX/lib/fpc/${FPC_VERSION}/units/${TARGET}/hash"
          FCL_BASE_SRC="$PREFIX/share/fpcsrc/packages/fcl-base/src"
          FCL_NET_SRC="$PREFIX/share/fpcsrc/packages/fcl-net/src"
          OPENSSL_SRC="$PREFIX/share/fpcsrc/packages/openssl/src"
          HASH_FLAGS=""
          if [ -d "$HASH_DIR" ]; then
            HASH_FLAGS="-Fu${HASH_DIR}"
            echo "hash units: $(find "$HASH_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ') .ppu files"
          fi
          RTL_EXTRA_FLAGS=""
          if [ -d "$RTL_EXTRA_DIR" ]; then
            RTL_EXTRA_FLAGS="-Fu${RTL_EXTRA_DIR}"
            echo "rtl-extra units: $(find "$RTL_EXTRA_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ') .ppu files"
          fi

          require_dir() {
            local dir="$1"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing directory for ${TARGET}: ${dir}"
              exit 1
            fi
          }

          require_unit() {
            local dir="$1"
            local unit="$2"
            if [ ! -f "$dir/${unit}.ppu" ]; then
              echo "::error::Missing ${unit}.ppu in ${dir} for ${TARGET}"
              exit 1
            fi
          }

          require_dir "$PASZLIB_DIR"
          PASZLIB_COUNT="$(find "$PASZLIB_DIR" -maxdepth 1 -name '*.ppu' | wc -l | tr -d ' ')"
          echo "paszlib units: ${PASZLIB_COUNT} .ppu files"
          for unit in strutils dateutils variants; do
            require_unit "$OBJPAS_DIR" "$unit"
          done
          for unit in generics.collections generics.defaults; do
            require_unit "$GEN_DIR" "$unit"
          done
          for unit in process pipes; do
            require_unit "$FCL_DIR" "$unit"
          done
          require_unit "$PASZLIB_DIR" zstream
          if [ ! -f "$PASZLIB_DIR/crc.ppu" ] && [ ! -f "$HASH_DIR/crc.ppu" ]; then
            echo "::error::Missing crc.ppu in paszlib/hash unit dirs for ${TARGET}"
            exit 1
          fi
          case "$OS" in
            win32|win64) require_unit "$RTL_DIR" winsock2 ;;
            *)
              if [ ! -f "$RTL_DIR/sockets.ppu" ] && [ ! -f "$RTL_EXTRA_DIR/sockets.ppu" ]; then
                echo "::error::Missing sockets.ppu in rtl/rtl-extra unit dirs for ${TARGET}"
                exit 1
              fi
              ;;
          esac

          mkdir -p build/compiled

          # Stamp the release version FROM THE TAG so the binary's
          # `lwpt --version` matches the release it ships in (e.g. a
          # 0.1.0-rc.3 release reports `lwpt 0.1.0-rc.3`). release.yml
          # compiles the cross-FPC directly — it does NOT go through
          # `lwpt build`, so the [prebuild] stamp-version hook never
          # fires here; we regenerate Version.inc explicitly. Only on
          # tag pushes; a manual workflow_dispatch keeps the committed
          # (manifest) version. See docs/ci.md "Release version stamping".
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "=== Stamping release version from tag ${GITHUB_REF_NAME} ==="
            LWPT_VERSION_OVERRIDE="${GITHUB_REF_NAME#v}" instantfpc scripts/stamp-version.pas
          fi

          # Release-grade build: -O4 -dPRODUCTION -Xs -CX -XX -B.
          # Same flag set as ci.yml's build stage, so a tagged commit's
          # binary equals what CI produces — single artefact provenance.
          # pr.yml's windows-cross-compile job mirrors the win64 leg of
          # the same flag set — keep all three in sync.
          echo "=== Building lwpt for ${TARGET} (release) ==="
          # shellcheck disable=SC2086  # $EXTRA_FLAGS is intentionally word-split
          "$CROSS_FPC" -T"${OS}" -O4 -dPRODUCTION -Xs -CX -XX -B \
            -Sh \
            -Fusource -Fisource \
            -Fupackages/httpclient/source -Fipackages/httpclient/source \
            -Fupackages/cli/source        -Fipackages/cli/source \
            -Fupackages/semver/source     -Fipackages/semver/source \
            -Fupackages/toml/source       -Fipackages/toml/source \
            -Fupackages/testing/source    -Fipackages/testing/source \
            -Fu"$RTL_DIR" $RTL_EXTRA_FLAGS -Fu"$OBJPAS_DIR" -Fu"$GEN_DIR" -Fu"$FCL_DIR" -Fu"$PASZLIB_DIR" $HASH_FLAGS \
            -Fu"$FCL_BASE_SRC" -Fu"$FCL_NET_SRC" -Fu"$OPENSSL_SRC" \
            -FU"build/compiled" -FE"build" \
            $EXTRA_FLAGS \
            -dFPC_SOFT_FPUX80 \
            source/lwpt.pas

          ls -la build/

          # Validate stamp-from-tag on the native target (the only one
          # executable on this build host). Version.inc is shared across
          # all targets, so a correct native stamp proves it for the
          # whole matrix. Guarded to tag pushes; skipped for cross
          # targets (can't run a foreign binary) + manual dispatch.
          if [ "$NATIVE" = "true" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            REPORTED="$(build/lwpt --version | head -1)"
            EXPECTED="lwpt ${GITHUB_REF_NAME#v}"
            echo "version check: reported='${REPORTED}' expected='${EXPECTED}'"
            if [ "$REPORTED" != "$EXPECTED" ]; then
              echo "::error::Release binary version mismatch: got '${REPORTED}', expected '${EXPECTED}' — stamp-from-tag failed"
              exit 1
            fi
          fi

      - name: Stage + strip binary
        run: |
          mkdir -p staged
          for candidate in build/lwpt build/lwpt.exe; do
            if [ -f "$candidate" ]; then
              cp "$candidate" staged/
            fi
          done
          if [ -z "$(ls -A staged/ 2>/dev/null)" ]; then
            echo "::error::No lwpt binary found in build/"
            exit 1
          fi
          for bin in staged/*; do
            llvm-strip "$bin" 2>/dev/null || strip "$bin" 2>/dev/null || true
          done
          ls -la staged/

      - name: Check Windows TLS imports (native client, runtime-loaded server)
        if: matrix.os == 'win64' || matrix.os == 'win32'
        run: |
          # ADR-0016 keeps the Windows client on SChannel; ADR-0024 uses
          # OpenSSL only through LoadLibrary for server accept. Parse both PE
          # import directories: objdump -p omits delay imports. Capture the
          # checker output before grep so pipefail/SIGPIPE cannot hide a match.
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 is required to inspect PE imports"
            exit 1
          fi
          if ! imports="$(
            python3 - staged/lwpt.exe <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          data = open(path, "rb").read()

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def u16(offset):
              require(offset + 2 <= len(data), "truncated uint16")
              return struct.unpack_from("<H", data, offset)[0]

          def u32(offset):
              require(offset + 4 <= len(data), "truncated uint32")
              return struct.unpack_from("<I", data, offset)[0]

          require(data[:2] == b"MZ", "missing DOS header")
          pe = u32(0x3c)
          require(data[pe:pe + 4] == b"PE\0\0", "missing PE header")
          sections_count = u16(pe + 6)
          optional_size = u16(pe + 20)
          optional = pe + 24
          magic = u16(optional)
          require(magic in (0x10b, 0x20b), "unsupported PE optional header")
          if magic == 0x10b:
              image_base = u32(optional + 28)
              directories_count = u32(optional + 92)
              directories = optional + 96
          else:
              require(optional + 32 <= len(data), "truncated PE32+ image base")
              image_base = struct.unpack_from("<Q", data, optional + 24)[0]
              directories_count = u32(optional + 108)
              directories = optional + 112
          size_of_headers = u32(optional + 60)
          section_table = optional + optional_size

          sections = []
          for index in range(sections_count):
              section = section_table + index * 40
              require(section + 40 <= len(data), "truncated section table")
              virtual_size = u32(section + 8)
              virtual_address = u32(section + 12)
              raw_size = u32(section + 16)
              raw_offset = u32(section + 20)
              sections.append((virtual_address, max(virtual_size, raw_size),
                               raw_offset, raw_size))

          def file_offset(rva):
              if rva < size_of_headers:
                  require(rva < len(data), "header RVA outside file")
                  return rva
              for virtual_address, span, raw_offset, raw_size in sections:
                  if virtual_address <= rva < virtual_address + span:
                      delta = rva - virtual_address
                      require(delta < raw_size and raw_offset + delta < len(data),
                              "RVA points outside raw section data")
                      return raw_offset + delta
              raise ValueError("unmapped RVA")

          def text_at(rva):
              offset = file_offset(rva)
              end = data.find(b"\0", offset)
              require(end >= 0, "unterminated DLL name")
              return data[offset:end].decode("ascii", "strict")

          def directory(index):
              if index >= directories_count:
                  return 0, 0
              entry = directories + index * 8
              require(entry + 8 <= optional + optional_size,
                      "truncated data directory")
              return u32(entry), u32(entry + 4)

          def imports():
              rva, size = directory(1)
              if rva == 0:
                  return
              offset = file_offset(rva)
              end = offset + size
              require(size >= 20 and end <= len(data), "invalid import directory")
              while offset + 20 <= end:
                  descriptor = data[offset:offset + 20]
                  if descriptor == b"\0" * 20:
                      return
                  yield "import", text_at(u32(offset + 12))
                  offset += 20
              raise ValueError("unterminated import directory")

          def delay_imports():
              rva, size = directory(13)
              if rva == 0:
                  return
              offset = file_offset(rva)
              end = offset + size
              require(size >= 32 and end <= len(data), "invalid delay-import directory")
              while offset + 32 <= end:
                  descriptor = data[offset:offset + 32]
                  if descriptor == b"\0" * 32:
                      return
                  attributes = u32(offset)
                  name_address = u32(offset + 4)
                  name_rva = name_address if attributes & 1 else name_address - image_base
                  require(name_rva >= 0, "invalid delay-import DLL address")
                  yield "delay-import", text_at(name_rva)
                  offset += 32
              raise ValueError("unterminated delay-import directory")

          try:
              entries = list(imports() or ()) + list(delay_imports() or ())
              for kind, name in entries:
                  print(f"{kind}: {name}")
          except (OSError, UnicodeError, ValueError) as error:
              print(f"PE import inspection failed: {error}", file=sys.stderr)
              sys.exit(2)
          PY
          )"; then
            echo "::error::PE import checker could not inspect staged/lwpt.exe"
            exit 1
          fi
          if LC_ALL=C grep -Eiq '^(import|delay-import):[[:space:]].*(libssl|libcrypto)' <<<"$imports"; then
            echo "::error::lwpt.exe imports libssl/libcrypto — clients use SChannel (ADR-0016) and servers must runtime-load OpenSSL (ADR-0024)"
            exit 1
          fi
          echo "OK: no normal or delay libssl/libcrypto imports in staged/lwpt.exe"

      - name: Upload release artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lwpt-release-${{ matrix.target }}
          retention-days: 7
          path: staged/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      # persist-credentials: false — packaging + the gh-release action
      # authenticate via the job token env, not workspace git config.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag + version
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Pre-release iff the version contains a hyphen (`-rc.1`, `-alpha`).
          if echo "$VERSION" | grep -q -- '-'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Tag:        $TAG"
          echo "Version:    $VERSION"
          echo "Prerelease: $PRERELEASE"

      - name: Download all build artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          pattern: lwpt-release-*

      - name: Package per-target archives
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"

          declare -A DISPLAY=(
            ["aarch64-darwin"]="macos-arm64"
            ["x86_64-darwin"]="macos-x64"
            ["x86_64-linux"]="linux-x64"
            ["aarch64-linux"]="linux-arm64"
            ["x86_64-win64"]="windows-x64"
            ["i386-win32"]="windows-x86"
          )

          targets=("aarch64-darwin" "x86_64-darwin" "x86_64-linux" "aarch64-linux" "x86_64-win64" "i386-win32")

          mkdir -p dist

          for target in "${targets[@]}"; do
            artefact_dir="artifacts/lwpt-release-${target}"
            if [ ! -d "$artefact_dir" ]; then
              echo "::warning::Skipping $target (no artefact present)"
              continue
            fi

            display="${DISPLAY[$target]}"
            archive_base="lwpt-${VERSION}-${display}"
            pkg_dir="dist/${archive_base}"
            mkdir -p "$pkg_dir"

            # Binary (Windows ships .exe, Unix ships extension-less).
            if [ -f "$artefact_dir/lwpt.exe" ]; then
              cp "$artefact_dir/lwpt.exe" "$pkg_dir/"
            elif [ -f "$artefact_dir/lwpt" ]; then
              cp "$artefact_dir/lwpt" "$pkg_dir/"
              chmod +x "$pkg_dir/lwpt"
            else
              echo "::error::No lwpt binary inside $artefact_dir"
              exit 1
            fi

            # Bundle docs the installer scripts and humans alike will look at.
            for f in README.md CONTEXT.md CONTRIBUTING.md AGENTS.md; do
              if [ -f "$f" ]; then cp "$f" "$pkg_dir/"; fi
            done
            mkdir -p "$pkg_dir/docs"
            cp docs/quick-start.md "$pkg_dir/docs/" 2>/dev/null || true
            cp docs/architecture.md "$pkg_dir/docs/" 2>/dev/null || true
            cp docs/build-system.md "$pkg_dir/docs/" 2>/dev/null || true

            cd dist
            # Format per target: zip for Windows, tar.gz for Unix.
            # Match the target's suffix anchored ("-win64" / "-win32")
            # rather than the substring "win" — `*win*` accidentally
            # matches `darwin` because "darwin" contains "win", which
            # earlier produced .zip artefacts on macOS instead of the
            # expected .tar.gz the install scripts download.
            case "$target" in
              *-win64|*-win32) zip -qr "${archive_base}.zip" "${archive_base}" ;;
              *)               tar -czf "${archive_base}.tar.gz" "${archive_base}" ;;
            esac
            cd ..

            rm -rf "$pkg_dir"
          done

          echo ""
          echo "=== Release archives ==="
          ls -la dist/

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          sums_tmp="$(mktemp)"
          # Globs are restricted to the archive extensions so the checksums
          # file (lwpt-<v>-checksums.txt) is never hashed against itself.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum lwpt-*.tar.gz lwpt-*.zip > "$sums_tmp" 2>/dev/null || true
          else
            shasum -a 256 lwpt-*.tar.gz lwpt-*.zip > "$sums_tmp" 2>/dev/null || true
          fi
          if [ ! -s "$sums_tmp" ]; then
            echo "::error::No archives found to checksum in dist/"
            ls -la
            exit 1
          fi
          mv "$sums_tmp" "lwpt-${{ steps.ver.outputs.version }}-checksums.txt"
          cat "lwpt-${{ steps.ver.outputs.version }}-checksums.txt"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v version="$VERSION" '
            /^## \[/ {
              if (capture) exit
              if (index($0, "## [" version "]") == 1) {
                capture = 1
                print
              }
              next
            }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md does not contain a section for ${VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          draft: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/lwpt-*.tar.gz
            dist/lwpt-*.zip
            dist/lwpt-*-checksums.txt

  install-smoke:
    # Post-publish gate: run the REAL install.sh against the release we
    # just published and assert the installed binary reports the tag.
    # This validates what the build job's native --version check cannot:
    # that the uploaded assets are downloadable, correctly named (the
    # macOS .zip-vs-.tar.gz class, PR #8), checksum-valid, and yield a
    # runnable binary. Targets the just-cut tag explicitly (no constant),
    # so it covers prerelease-flagged rc.x too — the everyday e2e
    # InstallScript test only resolves non-prerelease "latest". See
    # ADR-0018 for the three-layer install/version validation model.
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # No authenticated git ops here (we only read scripts/install.sh,
      # then fetch from public GitHub Releases) and the job uploads no
      # artefacts, so persisted credentials are unneeded — drop them.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install published release + verify reported version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          SCRATCH="$PWD/install-smoke-bin"
          rm -rf "$SCRATCH"; mkdir -p "$SCRATCH"

          echo "=== Installing ${TAG} via scripts/install.sh ==="
          LWPT_VERSION="$TAG" INSTALL_DIR="$SCRATCH" sh scripts/install.sh

          REPORTED="$("$SCRATCH/lwpt" --version | head -1)"
          EXPECTED="lwpt ${VERSION}"
          echo "version check: reported='${REPORTED}' expected='${EXPECTED}'"
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "::error::Installed release reports '${REPORTED}', expected '${EXPECTED}'"
            exit 1
          fi
          echo "OK: install.sh installed ${TAG} and the binary reports it"
