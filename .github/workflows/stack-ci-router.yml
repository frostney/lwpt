name: Stack CI router

# Keep the expensive PR matrix off noisy stack pushes. This workflow handles no
# PR code: it only reruns the existing pull-request run for the exact same-repo
# head that acquired both routing labels.
on:
  pull_request:
    branches:
      - main
      - 'codex/**'
    types:
      - labeled

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    if: >-
      ${{
        github.event.label.name == 'ci:ready' &&
        contains(github.event.pull_request.labels.*.name, 'stack:managed') &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the exact admitted head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for _ in {1..24}; do
            RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pr.yml \
              --commit "$HEAD_SHA" --event pull_request --limit 1 \
              --json databaseId,status --jq '.[0] | [.databaseId, .status] | @tsv')"
            if [ -n "$RUN" ]; then
              RUN_ID="${RUN%%$'\t'*}"
              RUN_STATUS="${RUN#*$'\t'}"
              if [ "$RUN_STATUS" = "completed" ]; then
                gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::No completed PR run found for $HEAD_SHA."
          exit 1
