name: Stack CI router

# Keep the expensive PR matrix off noisy stack pushes. This workflow handles no
# PR code: it only reruns the existing pull-request run for the exact same-repo
# head that acquired both routing labels.
on:
  pull_request:
    branches:
      - main
      - 'codex/**'
    types:
      - labeled

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    if: >-
      ${{
        github.event.label.name == 'ci:ready' &&
        contains(github.event.pull_request.labels.*.name, 'stack:managed') &&
        startsWith(github.event.pull_request.head.ref, 'codex/stack-') &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the exact admitted head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for _ in {1..24}; do
            RUN="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/pr.yml/runs" \
              -f event=pull_request -f per_page=100 \
              --jq ".workflow_runs[] | select(.head_sha == \"$HEAD_SHA\") | \
                select(any(.pull_requests[]?; .number == $PR_NUMBER)) | \
                [.id, .status] | @tsv" | head -n 1)"
            if [ -n "$RUN" ]; then
              RUN_ID="${RUN%%$'\t'*}"
              RUN_STATUS="${RUN#*$'\t'}"
              if [ "$RUN_STATUS" = "completed" ]; then
                gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::No completed PR run found for $HEAD_SHA."
          exit 1
