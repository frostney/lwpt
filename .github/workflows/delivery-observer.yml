name: Delivery observer

on:
  pull_request_target:
    branches:
      - main
      - 'codex/**'
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
      - closed
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: delivery-mutation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target and schedule both resolve this checkout from the
      # default branch. No pull-request code is fetched or executed here.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Reconcile exact-head state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/delivery/controller.py observe --event-path "$GITHUB_EVENT_PATH"
