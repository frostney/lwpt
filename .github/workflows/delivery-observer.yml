name: Delivery observer

on:
  pull_request_target:
    branches:
      - main
      - 'codex/**'
    types:
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - converted_to_draft
      - closed
  pull_request_review:
    branches:
      - main
      - 'codex/**'
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    branches:
      - main
      - 'codex/**'
    types:
      - created
      - edited
      - deleted
  check_run:
    types:
      - created
      - rerequested
      - completed
      - requested_action
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: delivery-mutation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      # Event and manual reconciliation both execute trusted default-branch
      # code. No pull-request code is fetched or executed here.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Reconcile exact-head state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/delivery/controller.py observe --event-path "$GITHUB_EVENT_PATH"
