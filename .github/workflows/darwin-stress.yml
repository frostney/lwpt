# TEMPORARY diagnostic workflow — hunts the intermittent aarch64-darwin
# fpc-proxy environment loss (the BuildSessions "compiler failed" misroute).
# Loops the exact ci.yml test command on macos-latest; on every failure it
# extracts the fail-fast guard's argv+environment dump from the test output.
# Dispatch-only; never triggered by pushes. Remove once the root cause lands.
name: Darwin proxy-env stress

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of lwpt test iterations
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  stress:
    runs-on: macos-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install FPC (brew)
        run: |
          brew list fpc >/dev/null 2>&1 || brew install fpc
          fpc -iV
          sysctl -n hw.ncpu machdep.cpu.brand_string || true

      - name: Bootstrap lwpt
        run: ./bootstrap.sh

      - name: lwpt install
        run: ./build/lwpt install

      - name: Stress loop
        run: |
          ITERATIONS="${{ inputs.iterations }}"
          mkdir -p stress-logs
          HITS=0
          FAILS=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::iteration $i"
            if ./build/lwpt test --bail=1 > "stress-logs/iter-$i.log" 2>&1; then
              echo "iteration $i: PASS"
            else
              FAILS=$((FAILS+1))
              echo "iteration $i: FAIL"
              if grep -q "proxy environment was lost in transit" "stress-logs/iter-$i.log"; then
                HITS=$((HITS+1))
                echo "--- GUARD HIT: received argv + environment ---"
                grep -A 80 "invoked as a compiler but" "stress-logs/iter-$i.log" | head -100
              else
                echo "--- failure without guard hit (different bug) ---"
                grep -E "✗|Error:|FAIL " "stress-logs/iter-$i.log" | head -20
              fi
            fi
            echo "::endgroup::"
          done
          echo "iterations: $ITERATIONS, failures: $FAILS, guard hits: $HITS"

      - name: Upload iteration logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: stress-logs
          path: stress-logs/
          if-no-files-found: warn
