# TOML — full TOML 1.1 parser.
#
# Co-developed with GocciaScript and established as an in-monorepo LWPT
# package per ADR-0014. Bundles OrderedStringMap + BaseMap as
# transitive deps — both are tiny utilities that only TOML needs
# inside LWPT, and shipping them inside the package keeps the unit
# fully self-contained.
#
# Manifest round-tripping is exercised through LWPT.Core.Test.pas.
# source/TOML.Test.pas owns the parser's structural depth and node
# limits for untrusted documents.

[package]
name    = "toml"
version = "0.2.1"
units   = ["source"]
