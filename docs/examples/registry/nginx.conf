# Example TLS-terminating reverse proxy in front of an LWPT registry
# (docs/registry-deployment.md, "Behind a reverse proxy").
#
# The proxy presents the public certificate for registry.example.com and
# re-encrypts to the registry container, which serves the same base URL
# (https://registry.example.com) with its own certificate for that name,
# typically issued by a private CA that only this proxy trusts. Discovery
# advertises the base URL, so the registry must be initialized with the
# public URL; a plain-HTTP backend cannot serve it.
#
# Registry protocol requirements this configuration keeps:
# - no response compression (hashes cover exact response bytes);
# - uploads reach the registry with an exact Content-Length (request
#   buffering), up to the registry's 256 MiB archive limit;
# - no redirects are added or rewritten (publication never follows them);
# - Authorization reaches the registry and is never logged.

events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;

  server {
    listen 8443 ssl;
    server_name registry.example.com;

    ssl_certificate /etc/nginx/tls/proxy.pem;
    ssl_certificate_key /etc/nginx/tls/proxy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip off;
    client_max_body_size 257m;
    proxy_request_buffering on;

    location / {
      proxy_pass https://registry:8443;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_redirect off;

      proxy_ssl_server_name on;
      proxy_ssl_name registry.example.com;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/nginx/tls/registry-ca.pem;

      proxy_connect_timeout 10s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }
  }
}
