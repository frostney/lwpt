name: LWPT dependency update

# Reusable weekly Dependabot-equivalent for lwpt.toml git-host deps
# (ADR-0039). Consumers enable it with a caller workflow:
#
#   name: lwpt-update
#   on:
#     schedule:
#       - cron: '17 6 * * 1'
#     workflow_dispatch:
#   jobs:
#     update:
#       uses: frostney/lwpt/.github/workflows/lwpt-update.yml@main
#       permissions:
#         contents: write
#         pull-requests: write
#
# The job runs `lwpt outdated`, then `lwpt update` when anything is
# not current, then opens a PR whose body quotes each GitHub release
# title and a notes snippet — the why, not just version numbers.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains lwpt.toml
        type: string
        default: '.'
      branch-name:
        description: Branch the updater commits onto
        type: string
        default: 'lwpt/update-dependencies'
      pr-title:
        description: Pull-request title
        type: string
        default: 'chore(deps): update lwpt dependencies'
      lwpt-ref:
        description: frostney/lwpt ref to bootstrap when no local binary exists
        type: string
        default: 'main'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout consumer
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Resolve lwpt
        working-directory: ${{ inputs.working-directory || '.' }}
        env:
          LWPT_REF: ${{ inputs.lwpt-ref || 'main' }}
        run: |
          set -euo pipefail
          if [ -x ./build/lwpt ] && ./build/lwpt outdated --help >/dev/null 2>&1; then
            echo "LWPT_BIN=$(pwd)/build/lwpt" >> "$GITHUB_ENV"
            echo "Using ./build/lwpt"
            exit 0
          fi
          if command -v lwpt >/dev/null 2>&1 && lwpt outdated --help >/dev/null 2>&1; then
            echo "LWPT_BIN=$(command -v lwpt)" >> "$GITHUB_ENV"
            echo "Using lwpt from PATH"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y fpc
          git clone --depth 1 --branch "$LWPT_REF" \
            https://github.com/frostney/lwpt.git /tmp/lwpt-src
          (cd /tmp/lwpt-src && ./bootstrap.sh)
          echo "LWPT_BIN=/tmp/lwpt-src/build/lwpt" >> "$GITHUB_ENV"

      - name: Scan and update
        id: scan
        working-directory: ${{ inputs.working-directory || '.' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$LWPT_BIN" outdated --json > /tmp/lwpt-outdated.json || true
          "$LWPT_BIN" outdated | tee /tmp/lwpt-outdated.txt || true
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path('/tmp/lwpt-outdated.json').read_text())
          packages = data.get('packages') or []
          pending = [p for p in packages if p.get('status') not in ('', 'current')]
          pathlib.Path('/tmp/lwpt-pending.json').write_text(json.dumps(pending))
          print(f'compared={len(packages)} pending={len(pending)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'pending={len(pending)}\n')
          PY
          pending_count=$(python3 -c 'import json,pathlib; print(len(json.loads(pathlib.Path("/tmp/lwpt-pending.json").read_text())))')
          echo "pending=$pending_count" >> "$GITHUB_OUTPUT"
          if [ "$pending_count" -eq 0 ]; then
            echo "No lwpt dependency updates."
            exit 0
          fi
          "$LWPT_BIN" update

      - name: Build pull-request body
        if: steps.scan.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess, textwrap

          pending = json.loads(pathlib.Path('/tmp/lwpt-pending.json').read_text())
          lines = [
              '## LWPT dependency updates',
              '',
              'These git-host dependencies have a newer advertised tag than',
              'the lockfile. Constraints were rewritten only when the latest',
              'tag is outside the authored `^` / `~` / exact spec; `lwpt',
              'update` then ran the install transaction so `lwpt.lock` and',
              '`lwpt.cfg` stay consistent.',
              '',
              '| Package | Constraint | Locked | Latest | Status |',
              '| --- | --- | --- | --- | --- |',
          ]
          notes = []
          for pkg in pending:
              lines.append(
                  f"| `{pkg.get('name','')}` | `{pkg.get('constraint','')}` | "
                  f"`{pkg.get('locked','')}` | `{pkg.get('latest','')}` | "
                  f"{pkg.get('status','')} |"
              )
              locator = pkg.get('locator') or ''
              source = pkg.get('source') or ''
              latest_ref = pkg.get('latestRef') or pkg.get('latest') or ''
              if source.startswith('gitlab:') or source.startswith('bitbucket:'):
                  notes.append(
                      f"### {pkg.get('name')} {latest_ref}\n\n"
                      f"Hosted outside GitHub (`{source}`); fetch release notes there."
                  )
                  continue
              if locator.count('/') != 1:
                  continue
              body = ''
              title = latest_ref
              for tag in (latest_ref, latest_ref.lstrip('vV'), 'v' + latest_ref.lstrip('vV')):
                  if not tag:
                      continue
                  proc = subprocess.run(
                      ['gh', 'api', f'repos/{locator}/releases/tags/{tag}'],
                      capture_output=True, text=True)
                  if proc.returncode != 0:
                      continue
                  try:
                      release = json.loads(proc.stdout)
                  except json.JSONDecodeError:
                      continue
                  title = release.get('name') or release.get('tag_name') or tag
                  body = (release.get('body') or '').strip()
                  break
              snippet = body
              if snippet:
                  snippet = '\n'.join(snippet.splitlines()[:40]).strip()
                  if len(body.splitlines()) > 40:
                      snippet += '\n\n…'
              else:
                  snippet = '_No GitHub release notes for this tag._'
              notes.append(f"### {pkg.get('name')} — {title}\n\n{snippet}")

          lines.append('')
          lines.append('## Why')
          lines.append('')
          if notes:
              lines.extend(notes)
          else:
              lines.append('No GitHub release notes were available.')
          pathlib.Path('/tmp/lwpt-pr-body.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Open or update pull request
        if: steps.scan.outputs.pending != '0'
        working-directory: ${{ inputs.working-directory || '.' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ inputs.branch-name || 'lwpt/update-dependencies' }}
          PR_TITLE: ${{ inputs.pr-title || 'chore(deps): update lwpt dependencies' }}
        run: |
          set -euo pipefail
          git add -A -- lwpt.toml lwpt.lock lwpt.cfg .lwpt || true
          if git diff --cached --quiet; then
            echo "Update ran but produced no file changes."
            exit 0
          fi
          git checkout -B "$BRANCH_NAME"
          git -c user.name='lwpt-bot' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "$PR_TITLE"
          git push --force-with-lease origin "HEAD:$BRANCH_NAME"
          existing=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$PR_TITLE" --body-file /tmp/lwpt-pr-body.md
          else
            gh pr create --title "$PR_TITLE" --body-file /tmp/lwpt-pr-body.md
          fi
